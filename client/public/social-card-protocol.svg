<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0E17"/>
      <stop offset="100%" style="stop-color:#0D1321"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#F5A623"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Chain nodes decorative -->
  <circle cx="960" cy="160" r="40" fill="none" stroke="#F5A62330" stroke-width="2"/>
  <circle cx="1040" cy="280" r="28" fill="none" stroke="#3B82F630" stroke-width="2"/>
  <circle cx="900" cy="340" r="52" fill="none" stroke="#F5A62318" stroke-width="2"/>
  <line x1="960" y1="160" x2="1040" y2="280" stroke="#1E293B" stroke-width="2"/>
  <line x1="1040" y1="280" x2="900" y2="340" stroke="#1E293B" stroke-width="2"/>
  <circle cx="960" cy="160" r="8" fill="#F5A62360"/>
  <circle cx="1040" cy="280" r="8" fill="#3B82F660"/>
  <circle cx="900" cy="340" r="8" fill="#F5A62340"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldGrad)"/>

  <!-- Status badge -->
  <rect x="60" y="195" width="185" height="34" rx="6" fill="#FBBF2415" stroke="#FBBF2450" stroke-width="1"/>
  <circle cx="82" cy="212" r="5" fill="#FBBF24"/>
  <text x="96" y="217" font-family="Arial, sans-serif" font-size="13" fill="#FBBF24" font-weight="700" letter-spacing="2">PRE-LAUNCH</text>

  <!-- Main title -->
  <text x="60" y="307" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="url(#goldGrad)" letter-spacing="2">MOONBALL</text>
  <text x="60" y="362" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="6">PROTOCOL</text>

  <!-- Divider -->
  <rect x="60" y="385" width="440" height="2" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Description -->
  <text x="60" y="428" font-family="Arial, sans-serif" font-size="22" fill="#CBD5E1">On-Chain Oracle · MOON Token on Base</text>
  <text x="60" y="464" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Smart Contract Overview · Contract Status</text>

  <!-- Info cards -->
  <rect x="60" y="500" width="196" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="158" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2">NETWORK</text>
  <text x="158" y="558" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="19" fill="#F5A623">Base</text>

  <rect x="270" y="500" width="196" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="368" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2">STANDARD</text>
  <text x="368" y="558" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="19" fill="#fff">ERC-20</text>

  <rect x="480" y="500" width="196" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="578" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2">MARKET</text>
  <text x="578" y="558" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="19" fill="#3B82F6">DEX Pool</text>

  <rect x="690" y="500" width="196" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="788" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B" letter-spacing="2">ORACLE</text>
  <text x="788" y="558" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#34D399">Multi-Source</text>

  <!-- URL -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#334155">moonball.replit.app/protocol</text>
</svg>
