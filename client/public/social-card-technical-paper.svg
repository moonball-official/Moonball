<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0E17"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#F5A623"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="630" x2="1200" y2="0" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#1E293B" stroke-width="1" opacity="0.4"/>

  <!-- Blue accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#blueGrad)"/>

  <!-- Document icon -->
  <rect x="68" y="215" width="120" height="150" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="68" y="215" width="120" height="36" rx="8" fill="#1E293B"/>
  <line x1="88" y1="280" x2="168" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="88" y1="300" x2="168" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="88" y1="320" x2="148" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="88" y1="340" x2="168" y2="340" stroke="#334155" stroke-width="2"/>
  <text x="128" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#F5A623" font-weight="700">TECH</text>

  <!-- Tag -->
  <rect x="240" y="195" width="200" height="32" rx="6" fill="#3B82F620" stroke="#3B82F660" stroke-width="1"/>
  <text x="340" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3B82F6" letter-spacing="2" font-weight="700">TECHNICAL PAPER</text>

  <!-- Main title -->
  <text x="240" y="295" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="url(#goldGrad)" letter-spacing="2">MOONBALL</text>
  <text x="240" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="6">PROTOCOL</text>

  <!-- Divider -->
  <rect x="240" y="373" width="400" height="2" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Description -->
  <text x="240" y="415" font-family="Arial, sans-serif" font-size="21" fill="#CBD5E1">Oracle Design · Tokenomics · Smart Contract</text>
  <text x="240" y="448" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Architecture for the MOON ERC-20 on Base</text>

  <!-- Section chips -->
  <rect x="240" y="490" width="160" height="34" rx="6" fill="#F5A62312" stroke="#F5A62340" stroke-width="1"/>
  <text x="320" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#F5A623" font-weight="700">ORACLE MODEL</text>

  <rect x="414" y="490" width="170" height="34" rx="6" fill="#3B82F612" stroke="#3B82F640" stroke-width="1"/>
  <text x="499" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3B82F6" font-weight="700">TOKENOMICS</text>

  <rect x="598" y="490" width="190" height="34" rx="6" fill="#34D39912" stroke="#34D39940" stroke-width="1"/>
  <text x="693" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34D399" font-weight="700">POOL CALCULATOR</text>

  <rect x="802" y="490" width="160" height="34" rx="6" fill="#FBBF2412" stroke="#FBBF2440" stroke-width="1"/>
  <text x="882" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FBBF24" font-weight="700">RISK FRAMEWORK</text>

  <!-- URL -->
  <text x="1160" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#334155">moonball.replit.app/technical-paper</text>
</svg>
